name: Publish Python Distribution to PyPI and TestPyPI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'step_guide.md'
      - 'api_reference.md'
      - 'LICENSE'
      - 'assets/**'
      - 'outputs/**'
      - '.gitignore'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-build:
    name: Run Tests and Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          pip install -e ".[dev]"
          
      - name: Run PyTest
        run: |
          pytest tests/
          
      - name: Build distribution
        run: |
          python -m build
          
      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: test-and-build
    runs-on: ubuntu-latest
    # Push to TestPyPI on every push to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Authenticate using TestPyPI API Token stored in GitHub Repository Secrets
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          verbose: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: test-and-build
    runs-on: ubuntu-latest
    # Push to production PyPI only when a GitHub Release is published
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Authenticate using PyPI API Token stored in GitHub Repository Secrets
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
